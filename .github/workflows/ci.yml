name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  mediation:
    name: complete mediation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The mediation law and its falsifiers. This is the gate that matters:
      # it decides from source alone, so it needs no pod and no network.
      - name: The mediation law
        run: cargo test --workspace

      # A hook that fails open is worse than no hook. Probe the boundary
      # red-then-green on the real binary rather than trusting the unit tests,
      # because what ships is the binary.
      - name: The gate is fail-closed on a real binary
        run: |
          set -euo pipefail
          cargo build --release -p ccn-gate
          gate=./target/release/ccn-gate

          probe() {
            echo "$2" | "$gate" | grep -q "\"permissionDecision\":\"$1\"" \
              || { echo "FAIL: expected $1 for: $2"; exit 1; }
          }

          # A consequential built-in is denied and redirected.
          probe deny  '{"hook_event_name":"PreToolUse","tool_name":"Bash"}'
          # A tool this build has never heard of is denied, not allowed.
          probe deny  '{"hook_event_name":"PreToolUse","tool_name":"ToolFromTheFuture"}'
          # Unparsable input is denied rather than crashing into a default.
          probe deny  'not json at all'
          # The mediated path itself is permitted, or the redirect deadlocks.
          probe allow '{"hook_event_name":"PreToolUse","tool_name":"mcp__nucleus__run"}'

          echo "OK: the gate refused every unmediated path"

      # The README tells people to paste a --disallowedTools list. A stale copy
      # of it is how `Task` went missing from the published one while the map
      # denied it correctly. Derive, then check the docs against the source.
      - name: The README's --disallowedTools list is the derived one
        run: |
          set -euo pipefail
          want=$(cargo run --quiet --example disallowed_tools -p ccn-core)
          grep -qF -- "$want" README.md || {
            echo "FAIL: README's --disallowedTools list is not ccn_core::disallowed_tools_arg()" >&2
            echo "expected: $want" >&2
            exit 1
          }
          grep -qF -- "$want" .claude/settings.nucleus.json 2>/dev/null \
            || echo "note: the opt-in settings file documents the list in prose, not verbatim"
          echo "OK: the published list is the derived one"

      # The defect this catches shipped: hooks.json pointed PreToolUse at
      # ${CLAUDE_PLUGIN_ROOT}/bin/ccn-gate, /bin is gitignored, and a hook whose
      # command cannot start is a NON-blocking error -- exit 127, a notice, and
      # the tool call proceeds. Installing the plugin left every built-in running
      # on the host while the user believed the boundary was up.
      #
      # Two things are checked, and the second is the one that matters: that the
      # path exists in a clean checkout, and that it denies when the real gate is
      # nowhere to be found.
      - name: The plugin's gate exists in a clean checkout and fails closed
        run: |
          set -euo pipefail

          hook=$(python3 -c "
          import json
          h = json.load(open('hooks/hooks.json'))
          print(h['hooks']['PreToolUse'][0]['hooks'][0]['command'])
          ")
          echo "hooks.json points at: $hook"

          # Resolve it the way Claude Code would, with this checkout as the root.
          resolved=${hook//'${CLAUDE_PLUGIN_ROOT}'/$(pwd)}
          if [ ! -x "$resolved" ]; then
            echo "FAIL: $resolved is not an executable file in a clean checkout." >&2
            echo "A hook that cannot start does not block -- the tool call proceeds." >&2
            exit 1
          fi

          # The real falsifier: no ccn-gate on PATH, no bundled binary.
          out=$(echo '{"hook_event_name":"PreToolUse","tool_name":"Bash"}' \
                | env -i PATH=/usr/bin:/bin "$resolved" || true)
          echo "$out"
          python3 -c "
          import json, sys
          d = json.loads(sys.argv[1])['hookSpecificOutput']
          assert d['permissionDecision'] == 'deny', d
          assert d['permissionDecisionReason'].strip(), 'a deny needs a reason'
          print('OK: with no gate binary anywhere, the hook denies')
          " "$out"

          # And it must block by exit code too, in case the JSON is never parsed.
          set +e
          echo '{"tool_name":"Bash"}' | env -i PATH=/usr/bin:/bin "$resolved" >/dev/null 2>&1
          code=$?
          set -e
          if [ "$code" != "2" ]; then
            echo "FAIL: the fallback exited $code; only exit 2 blocks on its own" >&2
            exit 1
          fi

          # The plugin must ship the mediated path as well as the gate, or the
          # gate's redirects point at tools nobody serves.
          python3 -c "
          import json
          m = json.load(open('.claude-plugin/plugin.json'))
          servers = m.get('mcpServers') or {}
          assert 'nucleus' in servers, 'the plugin declares no nucleus MCP server'
          print('OK: the plugin ships the gate and the server')
          "

      # The status line renders on every assistant message and on a 3s timer, so
      # two things must hold that unit tests cannot see: it must never reach the
      # node (a bar that boots a microVM to draw itself is a disaster), and it
      # must survive having no journal at all.
      - name: --statusline is cheap, offline, and never boots a pod
        run: |
          set -euo pipefail
          cargo build --release -p ccn-mcp
          mcp=$(pwd)/target/release/ccn-mcp

          # A `nucleus` on PATH that files a complaint if anything calls it.
          fake=$(mktemp -d)
          sentinel="$fake/was-called"
          printf '#!/bin/sh\ntouch "%s"\nexit 1\n' "$sentinel" > "$fake/nucleus"
          chmod +x "$fake/nucleus"

          export CCN_JOURNAL="$fake/journal.jsonl"
          export PATH="$fake:$PATH"

          # No journal, no transport: one quiet row, exit 0.
          out=$(echo '{}' | env -u NUCLEUS_PROXY_URL -u NUCLEUS_POD_SOCK NO_COLOR=1 "$mcp" --statusline)
          echo "$out"
          case "$out" in
            *"gate on"*) ;;
            *) echo "FAIL: an empty journal should still say the gate is on" >&2; exit 1 ;;
          esac

          if [ -e "$sentinel" ]; then
            echo "FAIL: --statusline invoked nucleus; it must never reach the node" >&2
            exit 1
          fi

          # A refusal must survive with its reason intact.
          cat > "$CCN_JOURNAL" <<'JOURNAL'
          {"ts":1,"tool":"read","subject":"a.rs","outcome":"allow","detail":null,"pod":"127.0.0.1:1"}
          {"ts":2,"tool":"run","subject":"git push","outcome":"refuse","detail":"git_push is never under codegen","pod":"127.0.0.1:1"}
          JOURNAL
          sed -i 's/^ *//' "$CCN_JOURNAL"

          out=$(echo '{}' | NO_COLOR=1 "$mcp" --statusline)
          echo "$out"
          case "$out" in
            *"git_push is never under codegen"*) ;;
            *) echo "FAIL: the refusal reason did not survive to the bar" >&2; exit 1 ;;
          esac

          if [ -e "$sentinel" ]; then
            echo "FAIL: --statusline invoked nucleus" >&2; exit 1
          fi

          echo "OK: the status line reads a file and nothing else"

      # `ccn-mcp --check` is this repo's verification of the mediated path, so
      # an unexercised one is a claim. Run it against a stand-in proxy that
      # speaks the real field names, in both directions — the second case is the
      # one worth having, because a checker that passes while containment is not
      # holding is worse than no checker.
      - name: --check passes a sound path and fails an unsound one
        run: |
          set -euo pipefail
          cargo build --release -p ccn-mcp
          mcp=./target/release/ccn-mcp

          probe() {
            python3 ci/mock-proxy.py "$1" 8799 & pid=$!
            trap 'kill $pid 2>/dev/null || true' EXIT
            for _ in $(seq 1 50); do
              if curl -sf http://127.0.0.1:8799/v1/health >/dev/null 2>&1; then break; fi
              sleep 0.1
            done

            set +e
            NUCLEUS_PROXY_URL=http://127.0.0.1:8799 "$mcp" --check
            got=$?
            set -e

            kill $pid 2>/dev/null || true
            trap - EXIT
            wait $pid 2>/dev/null || true

            if [ "$got" != "$2" ]; then
              echo "FAIL: --check against the '$1' proxy exited $got, expected $2" >&2
              exit 1
            fi
          }

          # A pod that refuses the escape probe: the path is sound.
          probe strict 0
          # A pod that SERVES /etc/shadow: three green steps, and it must still fail.
          probe broken 1

          echo "OK: --check distinguishes a sound mediated path from an unsound one"


      # The check that tells a HOST whether the boundary is up must itself be exercised, or it
      # is one more thing that claims to be in force and is not. CI has no plugin installed, so
      # it drives both directions against fabricated homes: a host where every condition holds
      # must read IN FORCE, and each condition removed on its own must flip it.
      - name: The boundary check can say both things
        run: |
          set -euo pipefail
          chmod +x scripts/check-boundary-in-force.sh

          fake=$(mktemp -d); mkdir -p "$fake/.claude/plugins" "$fake/bin"
          printf '#!/bin/sh\nexit 0\n' > "$fake/bin/ccn-gate"; chmod +x "$fake/bin/ccn-gate"
          good_settings='{"enabledPlugins": {"nucleus@local": true}}'
          installed='{"version": 2, "plugins": {"nucleus@local": [{"scope": "user"}]}}'
          echo "$installed" > "$fake/.claude/plugins/installed_plugins.json"

          echo "$good_settings" > "$fake/.claude/settings.json"
          if ! HOME="$fake" PATH="$fake/bin:$PATH" scripts/check-boundary-in-force.sh; then
            echo "FAIL: a host where every condition holds must read IN FORCE." >&2
            exit 1
          fi

          # Each condition, removed on its own, must red. A check that only ever says one thing
          # is the defect it exists to catch.
          fail_one() {
            if HOME="$fake" PATH="$2:$PATH" scripts/check-boundary-in-force.sh >/dev/null; then
              echo "FAIL: $1 did not flip the check to NOT IN FORCE." >&2
              exit 1
            fi
            echo "ok: $1 reds"
          }

          echo '{"enabledPlugins": {"nucleus@local": true}, "disableAllHooks": true}' > "$fake/.claude/settings.json"
          fail_one "disableAllHooks" "$fake/bin"

          echo '{"enabledPlugins": {"swift-lsp@claude-plugins-official": true}}' > "$fake/.claude/settings.json"
          fail_one "plugin not enabled" "$fake/bin"

          echo "$good_settings" > "$fake/.claude/settings.json"
          echo '{"version": 2, "plugins": {}}' > "$fake/.claude/plugins/installed_plugins.json"
          fail_one "plugin not installed" "$fake/bin"

          echo "$installed" > "$fake/.claude/plugins/installed_plugins.json"
          empty=$(mktemp -d)
          fail_one "ccn-gate absent" "$empty"

          rm -rf "$fake" "$empty"

  contract:
    name: the proxy still deserialises what we send
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `the_translation_emits_only_fields_the_route_deserialises` proves the
      # translation matches contracts/tool-proxy-requests.json. Nothing in this
      # repo can prove the contract still matches *nucleus*. This does, by
      # reading its Deserialize structs at the pinned commit — so a rename over
      # there fails a build here instead of 422ing in a session.
      - name: The contract matches nucleus's request structs
        run: ./ci/check-proxy-contract.sh

  vendor-seam:
    name: the seam holds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The point of this repo is that vendor knowledge lives HERE so nucleus
      # can stay clean. The failure mode is the reverse of nucleus's gate: a
      # nucleus internal leaking into this tree means the seam moved.
      - name: No nucleus internals vendored into the bridge
        run: |
          set -euo pipefail
          if grep -rInE 'nucleus[_-](ifc|policy|kernel|portcullis)' crates/ --include='*.rs'; then
            echo "FAIL: this bridge must talk to nucleus over its wire surface, not link its internals" >&2
            exit 1
          fi
          echo "OK: the bridge depends on routes, not on nucleus internals"
