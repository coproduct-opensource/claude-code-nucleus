# The pod this bridge is designed against.
#
# Everything ccn-gate refuses on the host, ccn-mcp forwards here — so this file,
# not the gate, is what decides the reach of a mediated call. The README's
# "Which pod, and where a write lands" section is the prose; this is the spec.
#
#   nucleus node create -f pod.yaml
#
# Adjust it. It is a starting point with its choices explained, not a policy
# anyone else's threat model has to accept.
apiVersion: nucleus/v1
kind: Pod
metadata:
  name: claude-code
  labels:
    # Deliberately absent: `enable_pod_mgmt: "true"`.
    #
    # It is what would mount /v1/pod/create and make subagents mediable. The
    # bridge denies Agent/Task instead (see Known Gaps), because an orchestrator
    # pod can spawn pods, and handing that to the session by default is a larger
    # grant than the thing it buys.
    app: claude-code-nucleus
spec:
  # The root every mediated path resolves against. `read`/`write`/`glob`/`grep`
  # accept a path under it, absolute or relative; anything else is refused as a
  # sandbox escape.
  work_dir: /work

  # A working day. The pod is a session's worth of tool calls, not one task.
  timeout_seconds: 86400

  # The Firecracker driver requires both of these. They are `Option` on
  # `PodSpecInner`, so a spec without them parses perfectly and is then refused
  # at launch with "missing spec.image" — which is how this file shipped: it was
  # validated as parsing and never as booting.
  image:
    # Paths on the machine running nucleus-node. On macOS that is inside the
    # Lima VM, not your Mac; `nucleus setup` installs both here.
    kernel_path: /var/lib/nucleus/artifacts/vmlinux
    rootfs_path: /var/lib/nucleus/artifacts/rootfs.ext4
    # The default, and load-bearing (nucleus#2784): a writable rootfs is
    # hard-linked into the jail rather than copied, so one pod's writes would be
    # visible to the next and would change the very artifact whose digest
    # `verify-attestation` checks. `/work` is writable in the guest regardless.
    read_only: true

  vsock:
    # How the tool-proxy inside the guest reaches the node — and the path the
    # signed MediationReceipts are shipped over. Give concurrent pods distinct
    # CIDs; 3 is the conventional first guest.
    guest_cid: 3
    port: 5005

  policy:
    type: profile
    # read/write/edit/run/glob/grep, network-isolated, no push. It blocks
    # **/.ssh/**, **/.aws/**, **/.env*, **/credentials*, /etc/shadow and
    # /etc/passwd, and sets `manage_pods: never` and `web_fetch`/`web_search`
    # to `never` — so those two mediated tools are served by the proxy and
    # refused by the lattice, which is a verdict rather than a break.
    #
    # `nucleus profiles` lists the rest. Swap this line to change what the
    # session may do; nothing in this bridge needs to know which one you pick.
    name: codegen
