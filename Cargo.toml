[workspace]
resolver = "2"
members = ["crates/ccn-core", "crates/ccn-gate", "crates/ccn-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/coproduct-opensource/claude-code-nucleus"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "net", "time"] }

[profile.release]
strip = true
